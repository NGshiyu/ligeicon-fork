# Ligeicon Fork Workflow Add Icon And Auto Update Metadata

## Action

Follow the add-icon-and-auto-update-metadata workflow:
1. Add one or more PNG files to an appropriate subdirectory under 'icon/' (e.g., icon/emby/, icon/04ProxySoft/).
2. Commit with message like 'Add files via upload'.
3. Trigger an auto-update process that updates 'README.md' and one or more JSON metadata files (e.g., 'lige-emby-icon.json', 'ligeicon.json').
4. Commit the updated metadata files with message 'Auto update [skip ci]'.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~15x per month
- Files: icon/*/*.png, README.md, lige-emby-icon.json

